name: 🐛 Bug report
description: Create a report to help us improve 🎉
labels:
  - bug

body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: view
    attributes:
      label: The view
      description: >
        Every view is config, so this is usually the whole answer: a table
        that comes out wrong is either the engine's fault or the jq's, and
        only the YAML says which. Paste the view from your hat, trimmed to
        the part that misbehaves.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        If applicable, add output to help explain the bug — what the view's
        script prints, or what an action's tab showed.
      render: shell
    validations:
      required: false
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps To Reproduce
      description: Describe steps to reproduce the behavior
    validations:
      required: false
  - type: textarea
    id: version
    attributes:
      label: Versions
      description: >
        The output of `rincewind version`, plus the versions of whatever the
        view calls — usually kubectl and jq.
      placeholder: |
        rincewind v1.2.3
        kubectl v1.31.1
        jq 1.7.1
    validations:
      required: true
