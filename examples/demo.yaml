# Cluster-free smoke test, so the TUI can be tried anywhere:
#
#   aldediggi -c examples
#
# The other files in this directory need kubectl and a cluster.

views:
  # Two echo calls emit two JSON documents — the stdout contract is a
  # *stream* of JSON values, and `rows` runs over each, so a script can pull
  # from several sources without merging them itself.
  - id: demo.services
    title: Demo services
    source:
      script: |
        echo '{"items":[{"name":"api","state":"Healthy","since":"2026-08-18T09:00:00Z","restarts":2}]}'
        echo '{"items":[{"name":"worker","state":"Degraded","since":"2026-08-20T07:30:00Z","restarts":17},
                        {"name":"cache","state":"Healthy","since":"2026-05-02T11:00:00Z","restarts":0}]}'
    rows: .items[]
    key: .name
    columns:
      - name: NAME
        expr: .name
      - name: STATE
        expr: .state
        emphasis: { Healthy: good, Degraded: bad }
      - name: RESTARTS
        expr: .restarts
      - name: SINCE
        expr: .since
        format: timestamp
      - name: AGE
        expr: .since
        format: age
    sort:
      - by: STATE
        rank: [Degraded, Healthy]
      - by: NAME
